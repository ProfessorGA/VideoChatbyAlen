<div class="room-wrapper">
  <div class="main-content">
    <div class="video-grid" [ngClass]="'grid-' + (remoteStreams.size + 1)">
      <!-- Local Video -->
      <div class="video-container local" [class.mirrored]="isMirrored">
        <video #localVideo [srcObject]="localStream" autoplay playsinline muted></video>
        <div class="user-label">You ({{ userName }})</div>
      </div>

      <!-- Remote Videos -->
      <div *ngFor="let peer of remoteStreams | keyvalue" class="video-container">
        <video [srcObject]="peer.value.stream" autoplay playsinline></video>
        <div class="user-label">{{ peer.value.userName }}</div>
      </div>
    </div>

    <div class="controls">
      <div class="device-selectors" *ngIf="showSettings">
        <div class="selector-group">
          <label><span class="material-icons">videocam</span> Camera</label>
          <select [(ngModel)]="selectedCamera" (change)="onCameraChange($event)" class="device-select">
            <option *ngFor="let device of cameras" [value]="device.deviceId">{{ device.label || 'Camera ' + device.deviceId }}</option>
          </select>
        </div>
        <div class="selector-group">
        <label><span class="material-icons">mic</span> Microphone</label>
        <select class="device-select" [ngModel]="selectedMic" (change)="onMicChange($event)">
          <option *ngFor="let mic of microphones" [value]="mic.deviceId">{{ mic.label }}</option>
        </select>
      </div>

      <div class="selector-group" *ngIf="speakers.length > 0">
        <label><span class="material-icons">volume_up</span> Speaker</label>
        <select class="device-select" [ngModel]="selectedSpeaker" (change)="onSpeakerChange($event)">
          <option *ngFor="let speaker of speakers" [value]="speaker.deviceId">{{ speaker.label }}</option>
        </select>
      </div>

      <div class="setting-item">
          <label>Mirror Mode</label>
          <input type="checkbox" [checked]="isMirrored" (change)="toggleMirror()">
        </div>
      </div>

      <button (click)="toggleAudio()" [class.off]="!isAudioOn" title="Toggle Mic">
        <span class="material-icons">{{ isAudioOn ? 'mic' : 'mic_off' }}</span>
      </button>
      <button (click)="toggleVideo()" [class.off]="!isVideoOn" title="Toggle Video">
        <span class="material-icons">{{ isVideoOn ? 'videocam' : 'videocam_off' }}</span>
      </button>
      <button (click)="toggleSettings()" [class.active]="showSettings" title="Settings">
        <span class="material-icons">settings</span>
      </button>
      <button (click)="leaveRoom()" class="hangup" title="Leave">
        <span class="material-icons">call_end</span>
      </button>
      <button (click)="toggleChat()" class="chat-toggle" title="Chat">
        <span class="material-icons">chat</span>
        <span class="badge" *ngIf="unreadMessages > 0">{{ unreadMessages }}</span>
      </button>
    </div>
  </div>

  <div class="chat-panel" [class.open]="isChatOpen">
    <div class="chat-header">
      <h3>Room: {{ roomCode }}</h3>
      <button (click)="toggleChat()" class="close-btn">&times;</button>
    </div>
    <div class="chat-messages" #chatContainer>
      <div *ngFor="let msg of messages" class="message" [class.own]="msg.userName === userName">
        <div class="msg-sender">{{ msg.userName }}</div>
        <div class="msg-content">{{ msg.content }}</div>
        <div class="msg-time">{{ msg.timestamp | date:'shortTime' }}</div>
      </div>
    </div>
    <div class="chat-input">
      <input type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Type a message...">
      <button (click)="sendMessage()">Send</button>
    </div>
  </div>
</div>
